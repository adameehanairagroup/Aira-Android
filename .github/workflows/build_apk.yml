name: Build Aira for Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package AiraPhone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aira-Android-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish APK to GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "Publishing APK: $APK_PATH"
            gh release delete v1.0.0-apk --yes --cleanup-tag || true
            gh release create v1.0.0-apk "$APK_PATH" \
              --title "Aira Android APK v1.0.0" \
              --notes "Official Aira Android Assistant APK engineered by Er. Adam Eehan & Aira 3 Ultra."
          else
            echo "Warning: APK file not found for release"
          fi
