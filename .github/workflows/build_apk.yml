name: Build Aira for Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package AiraPhone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Make Gradle Wrapper Executable & Ensure Wrapper JAR
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading gradle-wrapper.jar fallback..."
            mkdir -p gradle/wrapper
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aira-Android-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish APK to GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "Publishing APK: $APK_PATH"
            gh release create v1.0.0-apk "$APK_PATH" \
              --title "Aira Android APK v1.0.0" \
              --notes "Official Aira Android Assistant APK engineered by Er. Adam Eehan & Aira 3 Ultra." \
              --clobber || gh release upload v1.0.0-apk "$APK_PATH" --clobber
          else
            echo "Warning: APK file not found for release"
          fi
